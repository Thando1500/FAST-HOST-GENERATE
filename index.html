<script>
(function(){
  const intro=document.getElementById('intro');
  const bar=document.getElementById('introProgress');
  const percent=document.getElementById('introPercent');
  const duration=3000;
  const start=performance.now();
  function run(now){
    const progress=Math.min((now-start)/duration,1);
    const value=Math.max(1,Math.floor(progress*99)+1);
    bar.style.width=value+'%';
    percent.textContent=value+'%';
    if(progress<1){requestAnimationFrame(run);}
    else{
      bar.style.width='100%';
      percent.textContent='100%';
      setTimeout(()=>intro.classList.add('hide'),120);
    }
  }
  requestAnimationFrame(run);
})();
</script>

function currentLang(){return tr[document.getElementById('lang').value]?document.getElementById('lang').value:'en';}
function countryLabel(key,lang){const d=countryNames[key];if(!d)return key;const idx=lang==='pt'?2:lang==='af'?3:lang==='fr'?4:1;return d[0]+' '+d[idx];}
function lang(){const l=currentLang(),t=tr[l];document.documentElement.lang=l;document.documentElement.dir=l==='ar'||l==='ur'?'rtl':'ltr';document.title=l==='pt'?'GERENCIADOR DE HOST SNI':(t.label+' • SNI HOST MANAGER');document.getElementById('badge').textContent=t.badge;document.getElementById('hero').textContent=t.hero;document.getElementById('sni').textContent=t.sni;document.getElementById('sd').textContent=t.sd;document.getElementById('check').textContent=t.check;document.getElementById('cd').textContent=t.cd;document.getElementById('cb').textContent=t.cb;document.getElementById('pay').textContent=t.pay;document.getElementById('pd').textContent=t.pd;document.getElementById('createBtn').textContent=t.create;document.getElementById('copyBtn').textContent=t.copy;document.getElementById('countryPlaceholder').textContent=t.select;document.getElementById('host').placeholder=t.placeholder;document.getElementById('ph').placeholder=t.ph;document.getElementById('notice').textContent=t.note;document.getElementById('authNote').textContent=t.authorized;document.getElementById('out').textContent=t.payload;const footerLabels={en:'POWERED BY:',pt:'DESENVOLVIDO POR:',es:'DESARROLLADO POR:',fr:'PROPULSÉ PAR :',de:'ENTWICKELT VON:',ur:'تیار کردہ:',hi:'द्वारा संचालित:',sw:'IMEENDESHWA NA:',zh:'技术支持：',id:'DIBUAT OLEH:',ar:'مدعوم بواسطة:',zu:'KUNIKWE YI:',af:'AANGEDRYF DEUR:'};document.getElementById('footerLabel').textContent=footerLabels[l]||footerLabels.en;document.querySelectorAll('#country option[data-country]').forEach(o=>o.textContent=countryLabel(o.dataset.country,l));showSNI();}
document.getElementById('lang').addEventListener('change',lang);
function showSNI(){const t=tr[currentLang()];const country=document.getElementById('country').value;const box=document.getElementById('suggestions');box.replaceChildren();if(!country){const d=document.createElement('div');d.className='result';d.textContent=t.choose;box.appendChild(d);return;}const list=Array.isArray(sniData[country])?sniData[country]:[];if(!list.length){const d=document.createElement('div');d.className='result';d.textContent=t.empty;box.appendChild(d);return;}list.forEach(item=>{const d=document.createElement('div');d.className='result';const info=document.createElement('span');info.className='host';info.textContent=item.host+' ';const small=document.createElement('small');small.style.color='#9ba7c2';small.textContent='('+item.carrier+')';info.appendChild(small);const actions=document.createElement('span');actions.style.cssText='display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end';const copyBtn=document.createElement('button');copyBtn.className='secondary';copyBtn.type='button';copyBtn.textContent=t.copy;copyBtn.onclick=()=>copyText(item.host);const checkBtn=document.createElement('button');checkBtn.className='secondary';checkBtn.type='button';checkBtn.textContent=t.use;checkBtn.onclick=()=>checkOne(item.host);actions.append(copyBtn,checkBtn);d.append(info,actions);box.appendChild(d);});}
async function copyText(text){try{await navigator.clipboard.writeText(text);}catch(_){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}}
function checkOne(h){document.getElementById('host').value='https://'+h;check();document.getElementById('result').scrollIntoView({behavior:'smooth',block:'center'});}
async function check(){const t=tr[currentLang()],result=document.getElementById('result'),h=norm(document.getElementById('host').value);if(!valid(h)){result.innerHTML='<div class="result">'+t.invalid+' <span class="status offline">'+t.invalidStatus+'</span></div>';return;}result.innerHTML='<div class="result">'+t.testing+' <span class="status neutral">'+t.checking+'</span></div>';const started=performance.now(),controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),6000);try{await fetch('https://'+h+'/',{mode:'no-cors',cache:'no-store',signal:controller.signal});result.innerHTML='<div class="result"><span class="host">https://'+h+'<br><small>'+t.reachable+' • '+Math.round(performance.now()-started)+' ms</small></span><span class="status online">'+t.online+'</span></div>';}catch(_){result.innerHTML='<div class="result"><span class="host">https://'+h+'<br><small>'+t.noresponse+'</small></span><span class="status offline">'+t.offline+'</span></div>';}finally{clearTimeout(timeout);}}
function updatePayloadControls(){const method=document.getElementById('pMethod').value,port=document.getElementById('pPort'),protocol=document.getElementById('pProtocol').value,body=document.getElementById('pBody');if(protocol==='https'&&(!port.value||port.value==='80'))port.value='443';if(protocol==='http'&&(!port.value||port.value==='443'))port.value='80';body.style.display=method==='POST'?'block':'none';}
function payload(){const t=tr[currentLang()],h=norm(document.getElementById('ph').value),method=document.getElementById('pMethod').value,protocol=document.getElementById('pProtocol').value,pathRaw=document.getElementById('pPath').value.trim()||'/',port=Number(document.getElementById('pPort').value)|| (protocol==='https'?443:80),body=document.getElementById('pBody').value;const out=document.getElementById('out');if(!valid(h)||port<1||port>65535){out.textContent=t.invalid;return;}let path=pathRaw.replace(/\s/g,'');if(!path.startsWith('/'))path='/'+path;path=path.replace(/[\r\n]/g,'');let headers=document.getElementById('pHeaders').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).filter(x=>/^[!#$%&'*+.^_`|~0-9A-Za-z-]+\s*:\s*[^\r\n]*$/.test(x)).map(x=>x.replace(/[\r\n]/g,''));if(!headers.some(x=>/^Host\s*:/i.test(x)))headers.unshift('Host: '+h+(port!==80&&port!==443?':'+port:''));if(!headers.some(x=>/^User-Agent\s*:/i.test(x)))headers.push('User-Agent: FAST-HOST-GENERATE/1.0');if(!headers.some(x=>/^Accept\s*:/i.test(x)))headers.push('Accept: */*');if(method==='POST'&&!headers.some(x=>/^Content-Length\s*:/i.test(x)))headers.push('Content-Length: '+new TextEncoder().encode(body).length);headers.push('Connection: close');out.textContent=method+' '+path+' HTTP/1.1\n'+headers.join('\n')+(method==='POST'?'\n\n'+body:'');}
async function copyOut(){await copyText(document.getElementById('out').textContent);}
document.getElementById('pMethod').addEventListener('change',updatePayloadControls);document.getElementById('pProtocol').addEventListener('change',updatePayloadControls);updatePayloadControls();

lang();
</script></body></html>
